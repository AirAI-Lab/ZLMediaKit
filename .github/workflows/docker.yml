name: Release GHCR image

on:
  push:
    branches:
      - "release/*"
    tags:
      - "2026.*"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag (defaults to 2026.06.14-5f11d3b)"
        required: false
        default: "2026.06.14-5f11d3b"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out locked source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Resolve image tag
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            tag="${INPUT_TAG}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          if [[ "$tag" == release/* ]]; then tag="${tag##*/}"; fi
          [[ "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo "Invalid image tag: $tag" >&2; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push locked image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/airai-lab/zlmediakit:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Publish digest
        run: |
          echo "ghcr.io/airai-lab/zlmediakit@${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p release-metadata
          echo "${{ steps.build.outputs.digest }}" > release-metadata/zlmediakit-digest.txt

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: zlmediakit-digest-${{ steps.version.outputs.tag }}
          path: release-metadata/zlmediakit-digest.txt
